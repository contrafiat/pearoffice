# App-specific configuration for the release pipeline (scripts/release.sh,
# /home/tim/peerloomllc/RELEASE-PIPELINE.md).

# -- Identity -----------------------------------------------------------------
APP_NAME=PearOffice                          # Display name (used in logs, Nostr posts)
BUNDLE_ID=com.pearoffice                     # iOS bundle ID and Android package name
ARTIFACT_PREFIX=pearoffice                   # Prefix for the APK/AAB names (pearoffice-0.1.1.apk)

# -- Where the downloads go ----------------------------------------------------
# The source repo is private; releases are published on this public one.
RELEASES_REPO=peerloomllc/pearoffice-releases

# -- App Store -----------------------------------------------------------------
ASC_APP_ID=6820799007

# -- Mac Mini build host -------------------------------------------------------
MAC_MINI_HOST=Tims-Mac-mini.local

# -- Seeder stores ---------------------------------------------------------------
UMBREL_IMAGE=ghcr.io/peerloomllc/pearoffice-seeder
UMBREL_OFFICIAL_PR=6172                      # the first official listing, while it is open

# -- Nostr announcement --------------------------------------------------------
APP_TAGLINE="Spreadsheets, documents and slides you share with a link and edit together, straight between your devices. No account, no server, no cloud."
APP_WEBSITE=https://peerloomllc.com/pearoffice/
NOSTR_HASHTAGS="#PearOffice #Nostr #P2P #privacy #spreadsheets #Android #iOS #Zapstore"
